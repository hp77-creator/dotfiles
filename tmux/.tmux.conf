# ============================================================
#  TERMINAL & COLORS
# ============================================================

# Use tmux-256color (better than screen-256color for italics, undercurl, etc.)
set -g default-terminal "tmux-256color"

# Tell tmux the outer terminal supports true color (RGB)
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable undercurl support (for LSP diagnostics in Neovim)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'


# ============================================================
#  PREFIX KEY  (Ctrl+a instead of Ctrl+b — easier to reach)
# ============================================================

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix


# ============================================================
#  GENERAL SETTINGS
# ============================================================

# Start window and pane numbering from 1 (easier keyboard access)
set -g base-index 1
setw -g pane-base-index 1

# Re-number windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer (default is only 2000 lines)
set -g history-limit 50000

# Reduce escape-time (critical for Neovim — eliminates lag on Esc key)
set -sg escape-time 0

# Enable focus events (lets Neovim know when it gains/loses focus)
set -g focus-events on

# Enable mouse support
set -g mouse on

# Don't rename windows automatically (keeps your custom names)
set -g allow-rename off


# ============================================================
#  KEY BINDINGS
# ============================================================

# Reload config with prefix+r
unbind r
bind r source-file ~/.tmux.conf \; display-message "  Config reloaded!"

# Intuitive splits (opens in current directory)
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window in current directory
bind c new-window -c "#{pane_current_path}"

# Resize panes with prefix + h/j/k/l (hold prefix and repeat)
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# Maximize/restore a pane
bind -r m resize-pane -Z


# ============================================================
#  COPY MODE  (Vim-style)
# ============================================================

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi v   send -X begin-selection
bind-key -T copy-mode-vi C-v send -X rectangle-toggle       # block select
bind-key -T copy-mode-vi y   send -X copy-selection-and-cancel

# Don't exit copy mode when dragging with mouse
unbind -T copy-mode-vi MouseDragEnd1Pane


# ============================================================
#  STATUS BAR
# ============================================================

set -g status-position top        # status bar at top (Neovim's is at bottom)
set -g status-interval 5          # refresh every 5 seconds

# Colors (works well with nightfox)
set -g status-style "bg=#192330,fg=#cdcecf"

# Left: session name
set -g status-left-length 40
set -g status-left "#[bg=#81b29a,fg=#192330,bold]  #S #[bg=#192330,fg=#81b29a]"

# Right: host + time
set -g status-right-length 80
set -g status-right "#[fg=#63cdcf]  %H:%M  #[fg=#81b29a]󰒋 #h "

# Window tabs
set -g window-status-format         "#[fg=#526176] #I #W "
set -g window-status-current-format "#[bg=#2b3b51,fg=#81b29a,bold] #I #W #[bg=#192330,fg=#2b3b51]"

# Pane borders
set -g pane-border-style        "fg=#2b3b51"
set -g pane-active-border-style "fg=#81b29a"

# Message / command line style
set -g message-style "bg=#2b3b51,fg=#cdcecf"


# ============================================================
#  PLUGINS  (via TPM)
# ============================================================

set -g @plugin 'tmux-plugins/tpm'

# Seamless Ctrl+h/j/k/l navigation between tmux panes and Neovim splits
set -g @plugin 'christoomey/vim-tmux-navigator'

# Persist sessions across reboots
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# ---- Plugin settings ----

# Save/restore Neovim sessions too
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Auto-save every 15 min and restore on tmux start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'


# ============================================================
#  KEEP THIS LAST — initialise TPM
# ============================================================
run '~/.tmux/plugins/tpm/tpm'
